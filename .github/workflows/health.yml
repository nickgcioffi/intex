name: Scheduled health check
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  health:
    if: vars.DEPLOY_ENABLED == 'true' && vars.APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check live application
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 3 "$APP_URL/health" > health.json
          jq -e '.status == "ok" and (.version | type == "string")' health.json
