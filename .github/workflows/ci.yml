name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm run check && npm test && npm audit --audit-level=high
      - run: npm ci --prefix infra
      - run: npm --prefix infra run check && npm --prefix infra test && npm --prefix infra run synth && npm --prefix infra audit --audit-level=high
      - run: python -m pip install cfn-lint==1.60.1
      - run: cfn-lint infra/cdk.out/IntexPipeline.template.json
      - run: bash -n scripts/*.sh && npm run bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-bundle-and-template
          path: |
            dist/application.zip
            infra/cdk.out/IntexPipeline.template.json
          retention-days: 7
